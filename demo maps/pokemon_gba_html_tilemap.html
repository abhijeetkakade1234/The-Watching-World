<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon GBA Tilemap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: monospace
    }

    h1 {
      color: #e8d870;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase
    }

    #mapwrap {
      overflow-x: auto;
      background: #1a1a2e;
      padding: 4px;
      border: 2px solid #3a3a5e
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 4px 4px;
      justify-content: center;
      max-width: 680px
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 4px;
      font: 11px monospace;
      color: #aaa
    }

    .legc {
      width: 12px;
      height: 12px;
      flex-shrink: 0
    }
  </style>
</head>

<body>
  <h1>Pokemon GBA Tilemap</h1>
  <div id="mapwrap"><canvas id="c"></canvas></div>
  <div id="legend"></div>
  <script>
    const T = 16, COLS = 40, ROWS = 30;
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = COLS * T; c.height = ROWS * T;

    const TILES = { G1: 0, G2: 1, G3: 2, TG: 3, DT: 4, DV: 5, WT: 6, WI: 7, TR: 8, TK: 9, BU: 10, RK: 11, CL: 12, ST: 13, BR: 14, SH: 15, SF: 16, CG: 17, CE: 18, CR: 19, WS: 20, WE: 21 };

    function drawTile(x, y, type) {
      const px = x * T, py = y * T;
      ctx.save();
      switch (type) {
        case TILES.G1:
          ctx.fillStyle = '#5a9e38'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#4a8a2c'; ctx.fillRect(px + 2, py + 3, 2, 4); ctx.fillRect(px + 12, py + 5, 2, 3);
          ctx.fillStyle = '#6ab848'; ctx.fillRect(px + 8, py + 1, 1, 3); ctx.fillRect(px + 5, py + 9, 1, 4);
          break;
        case TILES.G2:
          ctx.fillStyle = '#4e8f30'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#5aaa38'; ctx.fillRect(px + 1, py + 1, 3, 3); ctx.fillRect(px + 11, py + 2, 2, 4);
          ctx.fillStyle = '#3d7225'; ctx.fillRect(px + 6, py + 6, 2, 5); ctx.fillRect(px + 3, py + 11, 3, 3);
          break;
        case TILES.G3:
          ctx.fillStyle = '#58a035'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#4d8c2d'; ctx.fillRect(px, py + 4, 4, 4); ctx.fillRect(px + 7, py, 4, 4);
          ctx.fillStyle = '#70c045'; ctx.fillRect(px + 6, py + 5, 2, 2);
          break;
        case TILES.TG:
          ctx.fillStyle = '#4e8f30'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#7ac450'; ctx.fillRect(px + 1, py + 4, 2, 12); ctx.fillRect(px + 9, py + 5, 2, 11);
          ctx.fillStyle = '#5aa838'; ctx.fillRect(px + 5, py + 2, 2, 14); ctx.fillRect(px + 13, py + 3, 2, 13);
          ctx.fillStyle = '#3d7225'; ctx.fillRect(px + 3, py + 8, 1, 3); ctx.fillRect(px + 7, py + 7, 1, 4);
          break;
        case TILES.DT:
          ctx.fillStyle = '#c8a060'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#b89050'; ctx.fillRect(px + 2, py + 2, 3, 3); ctx.fillRect(px + 4, py + 10, 4, 2);
          ctx.fillStyle = '#d4b070'; ctx.fillRect(px + 9, py + 5, 2, 2); ctx.fillRect(px + 11, py + 11, 3, 3);
          break;
        case TILES.DV:
          ctx.fillStyle = '#c0984e'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#a07840'; ctx.fillRect(px, py, 2, T); ctx.fillRect(px + 14, py, 2, T);
          ctx.fillStyle = '#d4b070'; ctx.fillRect(px + 2, py + 3, 2, 2); ctx.fillRect(px + 10, py + 9, 2, 2);
          break;
        case TILES.WT:
          ctx.fillStyle = '#c0984e'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#a07840'; ctx.fillRect(px, py, T, 2); ctx.fillRect(px, py + 14, T, 2);
          ctx.fillStyle = '#d4b070'; ctx.fillRect(px + 3, py + 3, 2, 2); ctx.fillRect(px + 9, py + 9, 2, 2);
          break;
        case TILES.WI:
          ctx.fillStyle = '#2878d8'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#3890f0'; ctx.fillRect(px, py + 5, 8, 2); ctx.fillRect(px + 8, py + 11, 8, 2);
          ctx.fillStyle = '#50a8ff'; ctx.fillRect(px + 2, py + 1, 5, 1); ctx.fillRect(px + 10, py + 7, 4, 1);
          break;
        case TILES.TR:
          ctx.fillStyle = '#4aaa2e'; ctx.fillRect(px + 2, py, 12, 12);
          ctx.fillStyle = '#3a9820'; ctx.fillRect(px, py + 4, T, 8);
          ctx.fillStyle = '#5ab83a'; ctx.fillRect(px + 4, py + 2, 8, 8);
          ctx.fillStyle = '#2a6810'; ctx.fillRect(px + 6, py + 10, 4, 6);
          ctx.fillStyle = '#4a2808'; ctx.fillRect(px + 7, py + 10, 2, 6);
          break;
        case TILES.TK:
          ctx.fillStyle = '#3a9820'; ctx.fillRect(px + 1, py, 14, 10);
          ctx.fillStyle = '#4aaa2e'; ctx.fillRect(px + 3, py + 2, 10, 8);
          ctx.fillStyle = '#5ab83a'; ctx.fillRect(px + 5, py + 1, 6, 6);
          ctx.fillStyle = '#4a2808'; ctx.fillRect(px + 6, py + 9, 4, 7);
          ctx.fillStyle = '#5a3010'; ctx.fillRect(px + 7, py + 9, 2, 7);
          break;
        case TILES.BU:
          ctx.fillStyle = '#3a8020'; ctx.fillRect(px + 1, py + 4, 14, 10);
          ctx.fillStyle = '#4a9828'; ctx.fillRect(px, py + 6, 16, 8);
          ctx.fillStyle = '#5aaa30'; ctx.fillRect(px + 2, py + 5, 4, 6); ctx.fillRect(px + 7, py + 4, 5, 7); ctx.fillRect(px + 12, py + 6, 3, 5);
          ctx.fillStyle = '#2d6018'; ctx.fillRect(px + 4, py + 12, 2, 2); ctx.fillRect(px + 10, py + 11, 2, 2);
          break;
        case TILES.RK:
          ctx.fillStyle = '#7888a0'; ctx.fillRect(px + 1, py + 4, 14, 10);
          ctx.fillStyle = '#8898b0'; ctx.fillRect(px + 2, py + 2, 12, 8);
          ctx.fillStyle = '#a0b0c0'; ctx.fillRect(px + 4, py + 2, 8, 4);
          ctx.fillStyle = '#5a6870'; ctx.fillRect(px + 1, py + 12, 14, 2);
          break;
        case TILES.CL:
          ctx.fillStyle = '#7888a0'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#9aaabb'; ctx.fillRect(px, py, T, 4);
          ctx.fillStyle = '#4a5860'; ctx.fillRect(px + 2, py + 4, 2, 12); ctx.fillRect(px + 9, py + 6, 2, 8);
          ctx.fillStyle = '#6878a0'; ctx.fillRect(px, py, T, 2);
          break;
        case TILES.ST:
          ctx.fillStyle = '#8898a8'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#7888a0'; ctx.fillRect(px, py, 8, 8); ctx.fillRect(px + 8, py + 8, 8, 8);
          ctx.fillStyle = '#5a6870'; ctx.fillRect(px, py + 8, T, 1); ctx.fillRect(px + 8, py, 1, 8);
          ctx.fillStyle = '#9aaabb'; ctx.fillRect(px, py, 1, 8); ctx.fillRect(px, py + 8, 1, 8);
          break;
        case TILES.BR:
          ctx.fillStyle = '#a07040'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#c09050'; ctx.fillRect(px, py, T, 3); ctx.fillRect(px, py + 13, T, 3);
          ctx.fillStyle = '#b08040'; ctx.fillRect(px, py + 6, T, 4);
          ctx.fillStyle = '#805030';
          [0, 4, 8, 12].forEach(ox => { ctx.fillRect(px + ox, py + 3, 2, 3); ctx.fillRect(px + ox, py + 10, 2, 3); });
          break;
        case TILES.SH:
          ctx.fillStyle = '#d0c080'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#a09050'; ctx.fillRect(px + 1, py + 4, 3, 12); ctx.fillRect(px + 12, py + 4, 3, 12);
          ctx.fillStyle = '#a87830'; ctx.fillRect(px, py, T, 4);
          ctx.fillStyle = '#e8ac58'; ctx.fillRect(px + 2, py + 1, 12, 2);
          ctx.fillStyle = '#ffd870'; ctx.fillRect(px + 5, py, 6, 2);
          ctx.fillStyle = '#f0e070'; ctx.fillRect(px + 4, py + 5, 8, 8);
          ctx.fillStyle = '#fff0a0'; ctx.fillRect(px + 6, py + 6, 4, 5);
          break;
        case TILES.SF:
          ctx.fillStyle = '#c8b880'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#e8d8a0'; ctx.fillRect(px, py, T, 2);
          ctx.fillStyle = '#ffd030'; ctx.fillRect(px + 4, py + 4, 8, 8);
          ctx.fillStyle = '#ffe870'; ctx.fillRect(px + 6, py + 5, 4, 6);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(px + 7, py + 5, 2, 2);
          ctx.fillStyle = '#a89050'; ctx.fillRect(px, py + 12, T, 4);
          break;
        case TILES.CG:
          ctx.fillStyle = '#2d1a4a'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#3a1f5e'; ctx.fillRect(px, py, 4, 4); ctx.fillRect(px + 8, py + 4, 4, 4); ctx.fillRect(px + 4, py + 8, 4, 4);
          ctx.fillStyle = '#6a20a0'; ctx.fillRect(px + 1, py + 9, 2, 5); ctx.fillRect(px + 7, py + 1, 2, 4);
          break;
        case TILES.CE:
          ctx.fillStyle = '#3c2860'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#8050c0';
          ctx.fillRect(px, py + 7, 7, 1); ctx.fillRect(px + 7, py + 4, 1, 7); ctx.fillRect(px + 10, py + 10, 6, 1);
          ctx.fillStyle = '#6030a0'; ctx.fillRect(px + 3, py + 12, 8, 1); ctx.fillRect(px + 2, py + 2, 4, 1);
          break;
        case TILES.CR:
          ctx.fillStyle = '#1a0828'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#3a1f5e'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#6a20a0'; ctx.fillRect(px + 2, py + 8, 2, 5); ctx.fillRect(px + 6, py + 1, 2, 4); ctx.fillRect(px + 11, py + 6, 2, 3);
          ctx.fillStyle = '#b060f0'; ctx.fillRect(px + 5, py + 5, 4, 4);
          ctx.fillStyle = '#c070ff'; ctx.fillRect(px + 6, py + 6, 2, 2);
          break;
        case TILES.WS:
          ctx.fillStyle = '#2060c0'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#2878d8'; ctx.fillRect(px + 2, py, T - 2, T);
          ctx.fillStyle = '#1a5ea8'; ctx.fillRect(px, py, 2, T);
          ctx.fillStyle = '#50a8ff'; ctx.fillRect(px + 4, py + 3, 6, 1); ctx.fillRect(px + 10, py + 9, 4, 1);
          break;
        case TILES.WE:
          ctx.fillStyle = '#2878d8'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#3890f0'; ctx.fillRect(px + 2, py + 2, 12, 12);
          ctx.fillStyle = '#1a5ea8'; ctx.fillRect(px, py + 14, T, 2);
          ctx.fillStyle = '#50a8ff'; ctx.fillRect(px + 3, py + 5, 4, 1); ctx.fillRect(px + 9, py + 10, 5, 1);
          break;
      }
      ctx.restore();
    }

    const G = TILES.G1, g = TILES.G2, H = TILES.G3,
      tg = TILES.TG, dt = TILES.DT, dv = TILES.DV, wt = TILES.WT,
      wi = TILES.WI, tr = TILES.TR, tk = TILES.TK, bu = TILES.BU,
      rk = TILES.RK, cl = TILES.CL, st = TILES.ST, br = TILES.BR,
      sh = TILES.SH, sf = TILES.SF, cg = TILES.CG, ce = TILES.CE,
      cr = TILES.CR, ws = TILES.WS, we = TILES.WE;

    const map = [
      [tr, tr, tr, tr, tr, tr, tr, tr, tr, tr, tr, tr, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, cl, G, G, g, g, H, H, g, G, G, g, H, H, g, G, G, g, H, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, dt, G, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, dt, g, G, H, g, G, H, g, G, H, g, G, rk, G, H, g, G, H, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, dt, H, H, G, g, H, G, g, H, G, g, H, G, g, H, G, g, H, cl, cl, cl, cl, cl, cl, cl, cl, cl, cl],
      [tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, dt, g, G, H, tg, tg, G, H, g, G, H, g, G, H, g, G, tr, tr, tr, tr, tr, cl, cl, cl, cl, cl, cl, cl],
      [tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, dt, G, H, g, tg, tg, H, g, G, H, g, G, H, g, tr, tk, tk, tr, tk, tr, tr, cl, cl, cl, cl, cl, cl, cl],
      [tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, dt, H, g, G, g, H, G, g, H, G, g, H, G, g, tr, tr, tr, tk, tr, tk, tr, cl, cl, cl, cl, cl, cl, cl],
      [tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, tr, tk, dt, G, H, g, G, g, H, G, H, g, G, H, g, G, H, g, G, tr, tk, tr, tr, cl, cl, cl, cl, cl, cl, cl],
      [ws, ws, ws, ws, ws, ws, ws, ws, ws, ws, ws, ws, wt, G, g, H, G, H, g, G, g, H, G, g, H, G, g, H, G, g, H, g, G, cl, cl, cl, cl, cl, cl, cl],
      [wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, br, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, G, cl, cl, cl, cl, cl, cl, cl],
      [wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, br, dt, dt, dt, dt, dt, dt, dt, dt, dt, dt, sh, sh, dt, dt, dt, dt, dt, dt, dt, g, tr, tr, cl, cl, cl, cl, cl],
      [wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wi, wt, G, G, g, H, G, g, H, g, G, dt, sf, sh, dt, G, H, g, G, H, g, H, tr, tr, cl, cl, cl, cl, cl],
      [we, we, we, we, we, we, we, we, we, we, we, we, wt, H, g, G, g, H, G, g, H, G, dt, dt, dt, dt, G, g, H, G, g, H, G, tr, tr, tr, cl, cl, cl, cl],
      [G, G, G, G, G, G, G, G, G, g, H, g, G, g, H, G, g, H, G, g, H, G, dt, G, H, g, G, H, g, G, H, g, G, g, tr, tr, cl, cl, cl, cl],
      [g, H, g, H, g, H, g, H, tg, tg, g, H, G, H, g, G, H, g, G, H, g, G, dt, H, g, G, H, g, G, H, g, G, H, g, tr, tr, tr, cl, cl, cl],
      [G, g, G, g, G, g, G, g, tg, tg, G, g, H, g, G, H, g, G, H, g, G, H, dt, g, G, H, g, G, bu, G, bu, G, g, G, g, tr, tr, tr, cl, cl],
      [H, G, H, G, H, G, H, G, g, H, G, H, G, H, g, G, g, H, G, g, H, G, dt, G, H, g, G, H, g, G, H, g, G, H, g, G, H, tr, tr, cl],
      [cg, cg, cg, cg, g, G, g, H, G, g, H, G, H, g, G, H, g, G, H, g, G, H, dt, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, tr, cl],
      [cg, ce, cg, cg, cg, G, g, H, G, g, bu, G, g, H, G, g, H, G, g, H, G, g, dt, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, G, cl],
      [ce, cg, ce, cg, cg, cg, H, g, G, H, G, g, H, G, g, H, G, g, H, G, g, H, dt, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, cl],
      [cg, ce, cr, cg, ce, cg, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, dt, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, cl],
      [ce, cg, cg, cr, cg, ce, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, dt, g, G, H, g, rk, G, H, g, G, H, g, G, H, g, G, cl],
      [cg, cr, ce, cg, cr, cg, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, dt, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, cl],
      [cr, cg, cg, ce, cg, cr, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, dt, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, cl],
      [cg, ce, cr, cg, ce, cg, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, dt, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, cl],
      [ce, cg, cg, cr, cg, ce, bu, g, G, H, g, G, H, g, G, H, g, tg, tg, H, g, G, dt, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, cl],
      [cg, cr, cg, cg, cr, cg, g, G, H, g, G, H, g, G, H, g, G, tg, tg, G, H, g, dt, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, cl],
      [cr, cg, ce, cg, cg, cr, G, H, g, G, H, g, G, H, g, G, H, g, G, H, g, G, dt, g, G, H, g, G, H, g, G, H, g, G, H, g, G, H, cl],
    ];

    for (let r = 0; r < ROWS; r++)
      for (let col = 0; col < COLS; col++)
        drawTile(col, r, map[r][col]);

    const legendData = [
      { color: '#5a9e38', label: 'grass' },
      { color: '#c8a060', label: 'dirt path' },
      { color: '#2878d8', label: 'water' },
      { color: '#4aaa2e', label: 'tree' },
      { color: '#a07040', label: 'bridge' },
      { color: '#d0c080', label: 'shrine' },
      { color: '#7888a0', label: 'rock' },
      { color: '#8898a8', label: 'cliff' },
      { color: '#4e8f30', label: 'tall grass' },
      { color: '#3a8020', label: 'bush' },
      { color: '#2d1a4a', label: 'corruption' },
      { color: '#3c2860', label: 'cracked earth' },
      { color: '#b060f0', label: 'dark energy' },
    ];
    const leg = document.getElementById('legend');
    legendData.forEach(d => {
      const el = document.createElement('div');
      el.className = 'leg';
      el.innerHTML = `<div class="legc" style="background:${d.color}"></div>${d.label}`;
      leg.appendChild(el);
    });
  </script>
</body>

</html>
